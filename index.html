<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>스케줄 캘린더 등록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<script src="skd-core.js"></script>
<style>
/* VOICE: crew-room practical, calm, nothing decorative
   IDEA: a departure board — each duty a row with large hanging times
   PICTURE: the schedule list itself, top of page, under a modest title
   COLOUR and TYPE: deep night-sky navy ground, white ink, amber-free: sky cyan accent; Plex Sans KR + Plex Mono times
   LAYOUT: one column up to 820px; controls band, board, action bar pinned at bottom */
:root{color-scheme:light dark;--bg:light-dark(#f4f6fa,#0b1526);--card:light-dark(#fff,#13213a);--ink:light-dark(#0d1b30,#eef3fb);--mute:light-dark(#5a6a82,#93a3bd);--line:light-dark(#dde3ec,#22324f);--acc:light-dark(#0f6fd6,#5fb8ff);--ok:light-dark(#11834f,#4fd39a);--bad:light-dark(#c0362c,#ff7a6e);--chip:light-dark(#eaf1fb,#1b2e4f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans KR",system-ui,sans-serif;overflow-x:clip;padding-bottom:110px}
.wrap{max-width:820px;margin:0 auto;padding:20px max(4vw,14px)}
h1{font-size:clamp(24px,5vw,34px);line-height:1.1;margin:6px 0 4px;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 16px;font-size:15px}
.drop{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1.5px dashed var(--line);border-radius:14px;padding:14px;background:var(--card)}
.drop.over{border-color:var(--acc)}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;min-height:44px;padding:0 16px;cursor:pointer;background:var(--chip);color:var(--ink)}
.btn.pri{background:var(--acc);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin:16px 0 8px;font-size:14px;color:var(--mute)}
.meta b{color:var(--ink);font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;margin:12px 0 18px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.opt label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
select{font:inherit;font-size:16px;width:100%;min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 8px}
.seg{display:flex;gap:4px}.seg button{flex:1;min-height:40px;font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.board{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:28px 92px minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:14px 4px;border-bottom:1px solid var(--line)}
.row input{width:22px;height:22px;margin-top:6px;accent-color:var(--acc)}
.t{font:600 22px/1.1 "IBM Plex Mono",monospace;white-space:nowrap}
.t small{display:block;font:500 13px/1.4 "IBM Plex Mono",monospace;color:var(--mute)}
.d{font-size:13px;color:var(--mute)}
.ttl{font-weight:700;font-size:17px}
.crew{font-size:13px;color:var(--mute)}
.st{font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--chip);white-space:nowrap}
.st.ok{color:var(--ok)}.st.bad{color:var(--bad)}.st.dup{color:var(--mute)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.side a{font-size:13px;color:var(--acc)}
.empty{padding:28px 8px;color:var(--mute);text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px max(4vw,14px) calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg{flex:1 1 200px;font-size:14px;color:var(--mute)}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.note{font-size:13px;color:var(--mute);margin-top:14px}
@media(max-width:600px){.row{grid-template-columns:26px 78px minmax(0,1fr)}.side{grid-column:3;flex-direction:row;align-items:center;justify-content:flex-start;gap:12px}.t{font-size:19px}}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.acct{font-size:14px;color:var(--mute);display:flex;gap:8px;align-items:center}
details.set{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.set summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
details.set input{font:inherit;font-size:16px;width:100%;min-height:42px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 10px;margin:6px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>스케줄 → 구글 캘린더</h1>
    <div class="acct"><span id="who">로그인 안 됨</span><button class="btn" id="login">Google 로그인</button></div>
  </div>
  <p class="sub">회사 MONTHLY SKD 엑셀(.xls)을 올리면 내 비행만 골라 캘린더에 넣습니다. 파일은 이 브라우저 안에서만 읽고 어디에도 올리지 않습니다.</p>

  <div class="drop" id="drop">
    <label class="btn pri" for="file" style="display:inline-flex;align-items:center">파일 선택</label>
    <input type="file" id="file" accept=".xls,.xlsx" hidden>
    <span id="fname" class="d">또는 파일을 여기로 끌어다 놓기</span>
  </div>

  <div class="meta" id="meta"></div>

  <div class="opts">
    <div class="opt"><label>묶는 방식</label>
      <div class="seg" id="segGroup"><button data-v="leg" aria-pressed="true">구간별</button><button data-v="day" aria-pressed="false">근무일별</button></div></div>
    <div class="opt"><label>일정 시작 시각</label>
      <div class="seg" id="segStart"><button data-v="std" aria-pressed="true">STD</button><button data-v="show" aria-pressed="false">쇼업</button></div></div>
    <div class="opt"><label for="cal">캘린더</label>
      <select id="cal"><option value="primary">기본 캘린더</option></select></div>
  </div>

  <ul class="board" id="board"></ul>
  <p class="note">시각은 엑셀에 적힌 그대로 한국 시간(KST)으로 넣습니다. 이미 넣은 일정은 식별표로 확인해 다시 넣지 않습니다.</p>

  <details class="set" id="set">
    <summary>설정</summary>
    <label for="cid" class="d">Google OAuth 클라이언트 ID</label>
    <input id="cid" placeholder="xxxxxxxx.apps.googleusercontent.com" autocomplete="off">
    <button class="btn" id="saveCid">저장</button>
    <p class="d">config.js에 넣어 두면 입력할 필요가 없습니다. 만드는 법은 저장소의 docs/google-setup.md를 보세요.</p>
  </details>
</div>

<div class="bar"><div class="in">
  <span class="msg" id="msg">파일을 올려 주세요.</span>
  <button class="btn" id="ics" disabled>.ics 저장</button>
  <button class="btn pri" id="add" disabled>캘린더에 추가</button>
</div></div>
<script src="app.js"></script>
</body>
</html>
