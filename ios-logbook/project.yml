# XcodeGen 설정. Mac에서 `xcodegen generate` 하면 PilotLogbook.xcodeproj 가 만들어집니다.
# 번들 ID와 iCloud 컨테이너 ID는 본인 것으로 바꿔야 합니다 (README 참고).
name: PilotLogbook
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
packages:
  LogbookCore:
    path: LogbookCore
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  PilotLogbook:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: LogbookCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pilotlogbook   # ← 바꾸기
        DEVELOPMENT_TEAM: ""                                   # ← Xcode에서 팀 선택
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: 로그북
        CFBundleDevelopmentRegion: ko
        UILaunchScreen: {}
        NSCameraUsageDescription: ACARS OOOI 화면을 찍어 비행 시각을 자동으로 입력합니다.
        NSPhotoLibraryUsageDescription: 찍어 둔 OOOI 화면 사진을 불러옵니다.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Config/PilotLogbook.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.example.pilotlogbook                  # ← "iCloud." + 번들 ID
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        aps-environment: development
