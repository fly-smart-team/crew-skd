<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스케줄 캘린더 등록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* VOICE: crew-room practical, calm, nothing decorative
   IDEA: a departure board — each duty a row with large hanging times
   PICTURE: the schedule list itself, top of page, under a modest title
   COLOUR and TYPE: deep night-sky navy ground, white ink, amber-free: sky cyan accent; Plex Sans KR + Plex Mono times
   LAYOUT: one column up to 820px; controls band, board, action bar pinned at bottom */
:root{color-scheme:light dark;--bg:light-dark(#f4f6fa,#0b1526);--card:light-dark(#fff,#13213a);--ink:light-dark(#0d1b30,#eef3fb);--mute:light-dark(#5a6a82,#93a3bd);--line:light-dark(#dde3ec,#22324f);--acc:light-dark(#0f6fd6,#5fb8ff);--ok:light-dark(#11834f,#4fd39a);--bad:light-dark(#c0362c,#ff7a6e);--chip:light-dark(#eaf1fb,#1b2e4f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans KR",system-ui,sans-serif;overflow-x:clip;padding-bottom:110px}
.wrap{max-width:820px;margin:0 auto;padding:20px max(4vw,14px)}
h1{font-size:clamp(24px,5vw,34px);line-height:1.1;margin:6px 0 4px;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 16px;font-size:15px}
.drop{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1.5px dashed var(--line);border-radius:14px;padding:14px;background:var(--card)}
.drop.over{border-color:var(--acc)}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;min-height:44px;padding:0 16px;cursor:pointer;background:var(--chip);color:var(--ink)}
.btn.pri{background:var(--acc);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin:16px 0 8px;font-size:14px;color:var(--mute)}
.meta b{color:var(--ink);font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;margin:12px 0 18px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.opt label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
select{font:inherit;font-size:16px;width:100%;min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 8px}
.seg{display:flex;gap:4px}.seg button{flex:1;min-height:40px;font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.board{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:28px 92px minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:14px 4px;border-bottom:1px solid var(--line)}
.row input{width:22px;height:22px;margin-top:6px;accent-color:var(--acc)}
.t{font:600 22px/1.1 "IBM Plex Mono",monospace;white-space:nowrap}
.t small{display:block;font:500 13px/1.4 "IBM Plex Mono",monospace;color:var(--mute)}
.d{font-size:13px;color:var(--mute)}
.ttl{font-weight:700;font-size:17px}
.crew{font-size:13px;color:var(--mute)}
.st{font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--chip);white-space:nowrap}
.st.ok{color:var(--ok)}.st.bad{color:var(--bad)}.st.dup{color:var(--mute)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.side a{font-size:13px;color:var(--acc)}
.empty{padding:28px 8px;color:var(--mute);text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px max(4vw,14px) calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg{flex:1 1 200px;font-size:14px;color:var(--mute)}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.note{font-size:13px;color:var(--mute);margin-top:14px}
@media(max-width:600px){.row{grid-template-columns:26px 78px minmax(0,1fr)}.side{grid-column:3;flex-direction:row;align-items:center;justify-content:flex-start;gap:12px}.t{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>스케줄 → 구글 캘린더</h1>
  <p class="sub">회사 MONTHLY SKD 엑셀(.xls)을 올리면 내 비행만 골라 캘린더에 넣습니다.</p>

  <div class="drop" id="drop">
    <label class="btn pri" for="file" style="display:inline-flex;align-items:center">파일 선택</label>
    <input type="file" id="file" accept=".xls,.xlsx" hidden>
    <span id="fname" class="d">또는 파일을 여기로 끌어다 놓기</span>
  </div>

  <div class="meta" id="meta"></div>

  <div class="opts">
    <div class="opt"><label>묶는 방식</label>
      <div class="seg" id="segGroup"><button data-v="leg" aria-pressed="true">구간별</button><button data-v="day" aria-pressed="false">근무일별</button></div></div>
    <div class="opt"><label>일정 시작 시각</label>
      <div class="seg" id="segStart"><button data-v="std" aria-pressed="true">STD</button><button data-v="show" aria-pressed="false">쇼업</button></div></div>
    <div class="opt"><label for="cal">캘린더</label>
      <select id="cal"><option value="">기본 캘린더</option></select></div>
  </div>

  <ul class="board" id="board"></ul>
  <p class="note">시각은 엑셀에 적힌 그대로 한국 시간(KST)으로 넣습니다. 같은 일정은 설명란의 식별표로 확인해 두 번 넣지 않습니다.</p>
</div>

<div class="bar"><div class="in">
  <span class="msg" id="msg">파일을 올려 주세요.</span>
  <button class="btn" id="ics" disabled>.ics 저장</button>
  <button class="btn pri" id="add" disabled>캘린더에 추가</button>
</div></div>

<script>
//PARSE-START
function norm(s){return String(s==null?'':s).replace(/\s+/g,' ').trim()}
function parseSkd(rows){
  let emp='',month='';
  rows.forEach(r=>r.forEach((c,i)=>{
    const s=norm(c);
    const nxt=()=>{for(let j=i+1;j<r.length;j++){const v=norm(r[j]);if(v)return v}return ''};
    if(/^EMPL\s*:/i.test(s)&&!emp)emp=nxt();
    if(/^MONTH\s*:/i.test(s)&&!month)month=nxt();
  }));
  const h=rows.findIndex(r=>r.map(norm).includes('DATE')&&r.map(norm).includes('STD'));
  if(h<0)throw new Error('헤더(DATE/STD)를 찾지 못했습니다');
  const hdr=rows[h].map(norm),col=n=>hdr.indexOf(n);
  const C={date:col('DATE'),fl:col('FLIGHT'),show:col('SHOW UP'),sec:col('SECTOR'),std:col('STD'),sta:col('STA'),emp:col('EMPL'),name:col('NAME'),rank:col('RANK'),posn:col('POSN')};
  const g=(r,k)=>C[k]<0?'':norm(r[C[k]]);
  const legs=[];let cur=null;
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i];if(!r.some(c=>norm(c)))continue;
    const p={emp:g(r,'emp'),name:g(r,'name'),rank:g(r,'rank'),posn:g(r,'posn')};
    if(g(r,'fl')){
      cur={date:g(r,'date'),flight:g(r,'fl'),show:g(r,'show'),sector:g(r,'sec'),std:g(r,'std'),sta:g(r,'sta'),crew:[p]};legs.push(cur);
    }else if(cur&&g(r,'date')===cur.date&&!g(r,'std')){cur.crew.push(p)}
    else if(g(r,'date')){
      const txt=r.map(norm).filter((v,j)=>v&&![C.date,C.emp,C.name,C.rank,C.posn].includes(j)).join(' ');
      cur={date:g(r,'date'),flight:txt||'근무',show:'',sector:'',std:g(r,'std'),sta:g(r,'sta'),crew:[p]};legs.push(cur);
    }
  }
  const mine=emp?legs.filter(l=>l.crew.some(c=>c.emp===emp)):legs;
  const me=(legs.flatMap(l=>l.crew).find(c=>c.emp===emp)||{}).name||'';
  return {emp,month,me,legs:mine};
}
// "12/01(화)" + "01 19:15" -> naive local ms (UTC fields = local wall clock)
function toTime(month,date,spec,refMs){
  const Y=+month.slice(0,4),M=+month.slice(4,6);
  const dm=/(\d{1,2})\/(\d{1,2})/.exec(date);
  let m=dm?+dm[1]:M,y=Y+(dm&&+dm[1]<M-6?1:0);
  const baseDay=dm?+dm[2]:1;
  const t=/(?:(\d{1,2})\s+)?(\d{1,2}):(\d{2})/.exec(spec||'');
  if(!t)return null;
  let day=t[1]?+t[1]:baseDay;
  if(t[1]&&+t[1]<baseDay-15)m+=1;
  let ms=Date.UTC(y,m-1,day,+t[2],+t[3]);
  if(refMs!=null&&ms<refMs)ms+=86400000;
  return ms;
}
//PARSE-END
{
const $=id=>document.getElementById(id);
const S={data:null,group:'leg',start:'std',items:[],status:{},cal:''};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const iso=ms=>{const d=new Date(ms);return `${d.getUTCFullYear()}-${p2(d.getUTCMonth()+1)}-${p2(d.getUTCDate())}T${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}:00`};
const hm=ms=>{const d=new Date(ms);return `${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`};
const dlabel=ms=>{const d=new Date(ms);return `${d.getUTCMonth()+1}/${d.getUTCDate()} (${'일월화수목금토'[d.getUTCDay()]})`};
const fno=f=>/^\d+$/.test(f)?'OZ'+f:f;
const dur=m=>`${Math.floor(m/60)}:${p2(m%60)}`;

function legTimes(l,month){
  const std=toTime(month,l.date,l.std);
  const sta=std!=null?toTime(month,l.date,l.sta,std):null;
  let show=l.show?toTime(month,l.date,l.show):null;
  if(show!=null&&std!=null&&show>std)show-=86400000;
  return {std,sta,show};
}
function build(){
  const D=S.data;if(!D){S.items=[];return}
  const legs=D.legs.map(l=>({...l,...legTimes(l,D.month)}));
  const others=l=>l.crew.filter(c=>c.emp!==D.emp).map(c=>`${c.name} ${c.rank}`).join(', ');
  let groups;
  if(S.group==='day'){const m=new Map();legs.forEach(l=>{const k=l.date;(m.get(k)||m.set(k,[]).get(k)).push(l)});groups=[...m.values()]}
  else groups=legs.map(l=>[l]);
  S.items=groups.map(gp=>{
    const a=gp[0],z=gp[gp.length-1],fl=gp.filter(l=>l.sector);
    const chain=fl.length?[fl[0].sector.split('/')[0],...fl.map(l=>l.sector.split('/')[1]||'')].join('–'):'';
    const title=fl.length?`${fno(fl[0].flight)}${fl.slice(1).map(l=>'·'+l.flight).join('')} ${chain}`:a.flight;
    const st=(S.start==='show'&&a.show!=null)?a.show:a.std,en=z.sta;
    const block=gp.reduce((s,l)=>s+(l.std!=null&&l.sta!=null?(l.sta-l.std)/60000:0),0);
    const lines=gp.map(l=>l.sector?`${fno(l.flight)} ${l.sector.replace('/','→')}  STD ${l.std!=null?hm(l.std):'-'} / STA ${l.sta!=null?hm(l.sta):'-'}${l.show?'  쇼업 '+l.show:''}`:l.flight);
    const crew=[...new Set(gp.map(others).filter(Boolean))].join(' / ');
    const day=a.std!=null?a.std:toTime(D.month,a.date,'00:00');
    const dd=new Date(day);
    const tag=`skd:${D.emp}:${dd.getUTCFullYear()}${p2(dd.getUTCMonth()+1)}${p2(dd.getUTCDate())}:${gp.map(l=>l.flight).join('-').replace(/\s+/g,'')}`;
    const desc=[...lines,block?`BLOCK ${dur(block)}`:'',crew?`승무원: ${crew}`:''].filter(Boolean).join('\n')+`\n\n[${tag}]`;
    return {tag,title,start:st,end:en,allDay:st==null||en==null,day,desc,crew,loc:fl.length?fl[0].sector.split('/')[0]:'',on:true,block};
  });
}
function gLink(it){
  const f=ms=>iso(ms).replace(/[-:]/g,'').slice(0,15);
  const dates=it.allDay?`${f(it.day).slice(0,8)}/${f(it.day+86400000).slice(0,8)}`:`${f(it.start)}/${f(it.end)}`;
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(it.title)+'&dates='+dates+'&ctz=Asia/Seoul&details='+encodeURIComponent(it.desc)+'&location='+encodeURIComponent(it.loc);
}
const LBL={new:'',dup:'이미 있음',ok:'추가됨',bad:'실패',busy:'추가 중…'};
function render(){
  const D=S.data;
  $('meta').innerHTML=D?`<span>월 <b>${D.month.slice(0,4)}.${D.month.slice(4)}</b></span><span>사번 <b>${esc(D.emp)}</b></span>${D.me?`<span>이름 <b>${esc(D.me)}</b></span>`:''}<span>일정 <b>${S.items.length}건</b></span><span>BLOCK <b>${dur(S.items.reduce((s,i)=>s+i.block,0))}</b></span>`:'';
  $('board').innerHTML=S.items.length?S.items.map((it,i)=>{
    const s=S.status[it.tag]||'new';
    return `<li class="row"><input type="checkbox" data-i="${i}" ${it.on?'checked':''} ${s==='dup'||s==='ok'?'disabled':''} aria-label="${esc(it.title)} 선택">
    <div class="t">${it.allDay?'종일':hm(it.start)}<small>${it.allDay?'':'– '+hm(it.end)}</small></div>
    <div><div class="d">${dlabel(it.day)}</div><div class="ttl">${esc(it.title)}</div>${it.crew?`<div class="crew">${esc(it.crew)}</div>`:''}</div>
    <div class="side">${LBL[s]?`<span class="st ${s}">${LBL[s]}</span>`:''}<a href="${gLink(it)}" target="_blank" rel="noopener">구글에서 열기</a></div></li>`}).join(''):`<li class="empty">${D?'이 파일에서 본인 일정을 찾지 못했습니다.':'아직 불러온 스케줄이 없습니다.'}</li>`;
  const n=S.items.filter(i=>i.on&&!['dup','ok'].includes(S.status[i.tag])).length;
  $('add').disabled=!n||!mcp;$('add').textContent=n?`${n}건 캘린더에 추가`:'캘린더에 추가';
  $('ics').disabled=!S.items.length||!dl;
}
function say(t,cls){const m=$('msg');m.textContent=t;m.className='msg '+(cls||'')}

function load(buf,name){
  try{
    const wb=XLSX.read(buf,{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
    S.data=parseSkd(rows);S.status={};build();render();
    $('fname').textContent=name;
    say(`${S.items.length}건을 찾았습니다.`+(mcp?' 중복 확인 중…':''));
    checkDup();
  }catch(e){say('읽기 실패: '+e.message,'bad')}
}
$('file').addEventListener('change',e=>{const f=e.target.files[0];if(f)f.arrayBuffer().then(b=>load(b,f.name))});
const dz=$('drop');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over')});
dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');const f=e.dataTransfer.files[0];if(f)f.arrayBuffer().then(b=>load(b,f.name))});
function seg(id,key){$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S[key]=b.dataset.v;[...$(id).children].forEach(x=>x.setAttribute('aria-pressed',x===b));build();render();checkDup()})}
seg('segGroup','group');seg('segStart','start');
$('board').addEventListener('change',e=>{const i=e.target.dataset.i;if(i!=null){S.items[i].on=e.target.checked;render()}});
$('cal').addEventListener('change',e=>{S.cal=e.target.value;S.status={};render();checkDup()});

const GC='Google Calendar';let mcp=null,dl=null;
function errText(e){
  const c=e&&e.code;
  if(c==='needs_reauth')return 'Google Calendar 연결이 만료됐습니다. claude.ai 설정 → 커넥터에서 다시 연결해 주세요.';
  if(c==='server_not_connected'||c==='selection_required')return 'Google Calendar 커넥터가 없습니다. claude.ai 설정 → 커넥터에서 추가해 주세요. 그동안은 .ics 저장이나 "구글에서 열기"를 쓰세요.';
  if(c==='approval_required'||c==='not_in_manifest'||c==='consent_required')return '캘린더 접근 허용이 필요합니다. 버튼을 다시 눌러 허용해 주세요.';
  if(c==='blocked_by_policy')return '조직 정책으로 캘린더 접근이 막혀 있습니다.';
  if(c==='server_unavailable')return 'Google Calendar가 잠시 응답하지 않습니다. 잠시 후 다시 시도하세요.';
  return '오류: '+((e&&e.message)||c||'알 수 없음');
}
function calArgs(){return S.cal?{calendarId:S.cal}:{}}
async function checkDup(){
  if(!mcp||!S.items.length)return;
  const ts=S.items.map(i=>i.day);
  const a=Math.min(...ts)-86400000,b=Math.max(...ts)+2*86400000;
  try{
    let txt='',tok;
    for(let k=0;k<5;k++){
      const r=await mcp.callTool(GC,'list_events',{...calArgs(),startTime:iso(a),endTime:iso(b),timeZone:'Asia/Seoul',pageSize:250,...(tok?{pageToken:tok}:{})},{cache:false});
      const s=JSON.stringify(r.payload!=null?r.payload:r.content);txt+=s;
      tok=r.payload&&r.payload.nextPageToken;if(!tok)break;
    }
    let d=0;S.items.forEach(it=>{if(txt.includes(it.tag)){S.status[it.tag]='dup';d++}});
    render();say(d?`${S.items.length}건 중 ${d}건은 이미 캘린더에 있습니다.`:`${S.items.length}건 모두 새 일정입니다.`);
  }catch(e){say(errText(e),'bad')}
}
async function loadCals(){
  try{
    const r=await mcp.callTool(GC,'list_calendars',{});
    const found=[];(function walk(o){if(Array.isArray(o))o.forEach(walk);else if(o&&typeof o==='object'){if(typeof o.id==='string'&&(o.summary||o.name))found.push(o);Object.values(o).forEach(walk)}})(r.payload);
    const sel=$('cal');found.forEach(c=>{if(c.primary)return;const op=document.createElement('option');op.value=c.id;op.textContent=c.summaryOverride||c.summary||c.name;sel.appendChild(op)});
  }catch(e){}
}
$('add').addEventListener('click',async()=>{
  const todo=S.items.filter(i=>i.on&&!['dup','ok'].includes(S.status[i.tag]));
  $('add').disabled=true;let ok=0,bad=0,last=null;
  for(const it of todo){
    S.status[it.tag]='busy';render();
    const base={...calArgs(),summary:it.title,description:it.desc,location:it.loc,timeZone:'Asia/Seoul'};
    const t=it.allDay?{allDay:true,startTime:iso(it.day).slice(0,10)+'T00:00:00',endTime:iso(it.day+86400000).slice(0,10)+'T00:00:00'}:{startTime:iso(it.start),endTime:iso(it.end)};
    try{await mcp.callTool(GC,'create_event',{...base,...t});S.status[it.tag]='ok';ok++}
    catch(e){S.status[it.tag]='bad';bad++;last=e;if(['needs_reauth','server_not_connected','approval_required','not_in_manifest','blocked_by_policy','consent_required'].includes(e.code))break}
    render();
  }
  todo.forEach(it=>{if(S.status[it.tag]==='busy')delete S.status[it.tag]});
  render();
  if(bad)say(`${ok}건 추가, ${bad}건 실패. `+errText(last),'bad');else say(`${ok}건을 캘린더에 추가했습니다.`,'ok');
});
$('ics').addEventListener('click',async()=>{
  const u=ms=>{const d=new Date(ms-9*3600000);return `${d.getUTCFullYear()}${p2(d.getUTCMonth()+1)}${p2(d.getUTCDate())}T${p2(d.getUTCHours())}${p2(d.getUTCMinutes())}00Z`};
  const e=s=>s.replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,m=>'\\'+m);
  const ev=S.items.filter(i=>i.on).map(it=>['BEGIN:VEVENT',`UID:${it.tag}@skd`,`DTSTAMP:${u(Date.now()+9*3600000)}`,
    it.allDay?`DTSTART;VALUE=DATE:${iso(it.day).slice(0,10).replace(/-/g,'')}`:`DTSTART:${u(it.start)}`,
    it.allDay?`DTEND;VALUE=DATE:${iso(it.day+86400000).slice(0,10).replace(/-/g,'')}`:`DTEND:${u(it.end)}`,
    `SUMMARY:${e(it.title)}`,`LOCATION:${e(it.loc)}`,`DESCRIPTION:${e(it.desc)}`,'END:VEVENT'].join('\r\n'));
  const data=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SKD//KO',...ev,'END:VCALENDAR'].join('\r\n');
  try{await dl.save({filename:`SKD_${S.data.month}.ics`,data});say('.ics 파일을 저장했습니다. 구글 캘린더 → 설정 → 가져오기에서 올리면 됩니다.','ok')}
  catch(err){say('저장이 취소되었거나 실패했습니다.','bad')}
});
